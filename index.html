<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner Bill Splitter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bill Splitter</h1>
            <p class="subtitle">Calculate what everyone owes when you pay</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="current">Current Bill</button>
            <button class="tab-btn" data-tab="saved">Saved Bills</button>
        </div>

        <div class="tab-content active" id="current-bill">
            <div class="main-content">
            <div class="left-section">
                <div class="form-group">
                    <label for="bill-name">Bill Name</label>
                    <input type="text" id="bill-name" placeholder="Enter bill name">
                </div>
                <div class="form-group">
                    <label for="total-paid">Total Amount Paid (after tax & tip)</label>
                    <input type="number" id="total-paid" step="0.01" min="0" placeholder="0.00">
                </div>
                <div class="receipt-upload-form">
                    <h2>Upload Receipt Photo</h2>
                    <div class="form-group">
                        <label for="receipt-upload">Upload Receipt</label>
                        <input type="file" id="receipt-upload" accept="image/png,image/jpeg,image/jpg,image/bmp,image/webp,image/gif" style="display: none;">
                        <button type="button" id="upload-receipt-btn" class="btn btn-primary">Choose Receipt Photo</button>
                        <div id="receipt-preview" style="margin-top: 10px; display: none;">
                            <img id="receipt-image" style="max-width: 100%; max-height: 200px; border: 1px solid #ccc;">
                            <div style="margin-top: 10px;">
                                <button type="button" id="parse-receipt-btn" class="btn btn-primary">Parse Receipt</button>
                                <button type="button" id="cancel-upload-btn" class="btn btn-danger" style="margin-left: 10px;">Cancel</button>
                            </div>
                            <div id="parsing-status" style="margin-top: 10px; font-size: 0.85rem; opacity: 0.7;"></div>
                        </div>
                    </div>
                </div>
                <div class="parsed-items-section" id="parsed-items-section" style="display: none; margin-top: 25px; padding-top: 25px; border-top: 1px solid rgba(0, 0, 0, 0.1);">
                    <h2>Parsed Receipt Items</h2>
                    <div id="parsed-items-container"></div>
                    <div class="form-group" style="margin-top: 15px;">
                        <button type="button" id="add-all-parsed-btn" class="btn btn-primary">Add All to Bill</button>
                        <button type="button" id="clear-parsed-btn" class="btn btn-danger" style="margin-left: 10px;">Clear</button>
                    </div>
                </div>
                <div class="add-item-form" style="margin-top: 25px; padding-top: 25px; border-top: 1px solid rgba(0, 0, 0, 0.1);">
                    <h2>Add Receipt Item</h2>
                    <div class="form-group">
                        <label for="item-price">Item Price</label>
                        <input type="number" id="item-price" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="item-person">Person(s) - comma separated</label>
                        <input type="text" id="item-person" placeholder="Enter name(s), e.g. Alice, Bob" required>
                    </div>
                    <div class="form-group">
                        <button type="button" id="add-item-btn" class="btn btn-primary">+ Add Item</button>
                    </div>
                </div>
                <div class="form-group">
                    <button type="button" id="save-bill-btn" class="btn btn-primary">Save Bill</button>
                </div>
            </div>

            <div class="right-section">
                <div class="items-section">
                    <h2>Receipt Items</h2>
                    <div id="items-container">
                        <!-- Items will be added here dynamically -->
                    </div>
                </div>

                <div class="results-section">
                    <h2>Totals</h2>
                    <div id="results-container">
                        <p class="placeholder">Add items and enter total to see results</p>
                    </div>
                </div>
            </div>
            </div>
        </div>

        <div class="tab-content" id="saved-bills">
            <div class="saved-bills-container">
                <div id="saved-bills-list">
                    <p class="placeholder">No saved bills yet</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
